name: Lakehouse Connector CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'

    - name: Run Testcontainers Integration Test
      # The existing MinIO-backed suite stays local (docker compose). CI runs the
      # standalone IntegrationTest, which starts its own ephemeral MinIO container.
      run: mvn clean test -Dtest=IntegrationTest
      env:
        # Arrow's off-heap allocator needs java.nio opened on JDK 17.
        MAVEN_OPTS: "--add-opens java.base/java.nio=org.apache.arrow.memory.core,ALL-UNNAMED"
